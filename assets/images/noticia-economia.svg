<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="econGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052419"/>
      <stop offset="60%" stop-color="#083827"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#econGrad)"/>
  <!-- Trazos financieros con verde esmeralda y dorado -->
  <polyline points="50,290 150,250 250,270 350,180 450,210 550,110" fill="none" stroke="url(#goldAccent)" stroke-width="4"/>
  <polyline points="50,310 150,280 250,300 350,240 450,250 550,170" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="550" cy="110" r="7" fill="#fbbf24"/>
  
  <rect x="40" y="40" width="110" height="26" rx="4" fill="url(#goldAccent)"/>
  <text x="95" y="58" fill="#041f16" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">ECONOMÍA</text>
  <text x="40" y="325" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Mercados y Finanzas</text>
</svg>
