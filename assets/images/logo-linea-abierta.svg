<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo del isotipo -->
    <radialGradient id="badgeGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e4b35"/>
      <stop offset="60%" stop-color="#072d20"/>
      <stop offset="100%" stop-color="#031a12"/>
    </radialGradient>
    <!-- Gradiente dorado -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Gradiente verde brillante -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO CIRCULAR (Inspirado en la identidad oficial) -->
  <g transform="translate(10, 5)">
    <!-- Borde exterior dorado fino -->
    <circle cx="40" cy="40" r="39" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Fondo verde oscuro profundo -->
    <circle cx="40" cy="40" r="37" fill="url(#badgeGrad)"/>
    
    <!-- Patrón sutil punteado / textura institucional -->
    <circle cx="60" cy="22" r="1" fill="#ffffff" opacity="0.15"/>
    <circle cx="65" cy="22" r="1" fill="#ffffff" opacity="0.15"/>
    <circle cx="60" cy="27" r="1" fill="#ffffff" opacity="0.15"/>
    <circle cx="65" cy="27" r="1" fill="#ffffff" opacity="0.15"/>
    <circle cx="60" cy="32" r="1" fill="#ffffff" opacity="0.15"/>
    <circle cx="65" cy="32" r="1" fill="#ffffff" opacity="0.15"/>

    <!-- Ondas de transmisión doradas (radio / comunicación abierta) -->
    <path d="M 45 22 A 16 16 0 0 1 54 36" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 16 A 23 23 0 0 1 62 38" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Soporte de micrófono verde brillante -->
    <path d="M 28 35 C 28 46 44 46 44 35 L 44 45 C 44 49 41 51 36 51" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Micrófono blanco central -->
    <rect x="30.5" y="19" width="11" height="17" rx="5.5" fill="#ffffff"/>
    <!-- Ranuras del micrófono -->
    <line x1="33" y1="24" x2="39" y2="24" stroke="#072d20" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="33" y1="27.5" x2="39" y2="27.5" stroke="#072d20" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="33" y1="31" x2="39" y2="31" stroke="#072d20" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pestaña dorada inferior de base -->
    <path d="M 36 51 L 43 51" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- TIPOGRAFÍA DE MARCA: LINEA ABIERTA -->
  <g transform="translate(102, 16)">
    <!-- "LINEA" en tipografía geométrica moderna con detalle dorado en la 'A' -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="40" letter-spacing="2" fill="currentColor">LINE</text>
    
    <!-- Letra A con triángulo dorado icónico -->
    <g transform="translate(126, 3)">
      <polygon points="18,5 4,40 32,40" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter"/>
      <!-- Triángulo dorado en el counter de la A -->
      <polygon points="18,22 10,38 26,38" fill="url(#goldGrad)"/>
    </g>

    <!-- "ABIERTA" con espaciado amplio y color verde esmeralda institucional -->
    <text x="3" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" letter-spacing="9" fill="#0d9466">ABIERTA</text>
  </g>
</svg>
