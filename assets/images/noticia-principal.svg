<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f16"/>
      <stop offset="45%" stop-color="#083827"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00d68f"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#leadGrad)"/>
  
  <!-- Formas geométricas sutiles de fondo -->
  <circle cx="720" cy="90" r="180" fill="#10b981" opacity="0.08"/>
  <circle cx="120" cy="390" r="210" fill="#f59e0b" opacity="0.07"/>
  <circle cx="680" cy="380" r="140" fill="#047857" opacity="0.12"/>
  
  <!-- Silueta arquitectónica institucional estilizada -->
  <path d="M120,380 L120,240 L180,240 L180,380 Z M220,380 L220,210 L300,210 L300,380 Z M340,380 L340,160 L460,160 L460,380 Z M500,380 L500,210 L580,210 L580,380 Z M620,380 L620,250 L680,250 L680,380 Z" fill="#ffffff" opacity="0.06"/>
  <polygon points="330,160 400,100 470,160" fill="#ffffff" opacity="0.08"/>

  <!-- Trazos periodísticos sutiles -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="8,8"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#ffffff" stroke-opacity="0.04" stroke-dasharray="8,8"/>
  <rect x="60" y="360" width="140" height="4" fill="url(#accentLine)" rx="2"/>

  <!-- Insignia y textos -->
  <rect x="50" y="50" width="110" height="28" rx="4" fill="url(#goldBadge)"/>
  <text x="105" y="69" fill="#041f16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">POLÍTICA</text>
  
  <text x="60" y="340" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="900">Cobertura Especial</text>
  <text x="60" y="390" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" letter-spacing="1">ARCHIVO PERIODÍSTICO / LINEA ABIERTA</text>
</svg>
